name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Download Skia
        shell: pwsh
        run: |
          $asset = (Invoke-RestMethod "https://api.github.com/repos/aseprite/skia/releases/latest").assets |
            Where-Object { $_.name -eq "Skia-Windows-Release-x64.zip" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile Skia-Windows-Release-x64.zip
          Expand-Archive -Path Skia-Windows-Release-x64.zip -DestinationPath skia

      - name: Configure
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$env:GITHUB_WORKSPACE\skia" `
            -DSKIA_LIBRARY_DIR="$env:GITHUB_WORKSPACE\skia\out\Release-x64" `
            -DSKIA_LIBRARY="$env:GITHUB_WORKSPACE\skia\out\Release-x64\skia.lib" `
            ..

      - name: Build
        shell: pwsh
        run: |
          cd build
          ninja aseprite

      - name: Upload Aseprite
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows
          path: |
            build/bin/aseprite.exe
            build/bin/data
